services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: otpusk
      POSTGRES_USER: otpusk
      POSTGRES_PASSWORD: otpusk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - otpusk_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otpusk -d otpusk"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  otpusk_postgres:
